<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多账号切换器</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 128 128" width="40" height="40">
          <g fill="#ffffff" opacity=".68">
            <circle cx="89" cy="56.5" r="12"/>
            <path d="M68 90a21 21 0 0 1 42 0v4.4a4.1 4.1 0 0 1-4.1 4.1H72.1A4.1 4.1 0 0 1 68 94.4z"/>
          </g>
          <g fill="#ffffff">
            <circle cx="44" cy="47" r="15.2"/>
            <path d="M21 85.6a23 23 0 0 1 46 0v7.6a4.6 4.6 0 0 1-4.6 4.6H25.6A4.6 4.6 0 0 1 21 93.2z"/>
          </g>
        </svg>
      </div>
      <div class="header-text">
        <h1>多账号切换器<span id="ver" class="ver"></span></h1>
        <p id="siteLabel">正在读取当前页面…</p>
      </div>
      <button id="resetBtn" class="icon-btn" type="button" title="清除当前网站的登录 Cookie 与本地设置，用于登录新账号（已保存的账号不会被删除）">新增</button>
    </header>

    <div id="notice" class="notice hidden"></div>

    <section class="panel">
      <div class="section-head">
        <div class="section-title">已保存账号 <span id="count" class="count">0</span></div>
      </div>

      <div id="accountList" class="list"></div>

      <div id="empty" class="empty hidden">
        <div class="empty-icon" aria-hidden="true">◎</div>
        <div class="empty-title">还没有保存账号</div>
        <div class="empty-desc">先在该网站登录一个账号，再点下方按钮保存。之后即可一键切换。</div>
      </div>
    </section>

    <footer class="footer">
      <button id="addBtn" class="btn btn-primary" type="button">
        <span class="plus">＋</span> 保存当前登录为新账号
      </button>
      <div class="footer-row">
        <button id="exportSiteBtn" class="btn btn-ghost" type="button" title="只导出当前网站的账号">导出本站</button>
        <button id="exportBtn" class="btn btn-ghost" type="button" title="导出所有网站与设置">导出全部</button>
        <button id="importBtn" class="btn btn-ghost" type="button">导入备份</button>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </div>
      <p class="tip">删除只移除<b>插件里保存的账号记录</b>，不改动浏览器登录状态。切换账号只在<b>当前页面</b>应用 Cookie 与主题设置，不会跳转。</p>
    </footer>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-mask"></div>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div id="modalIcon" class="modal-icon" aria-hidden="true">!</div>
      <h2 id="modalTitle" class="modal-title"></h2>
      <p id="modalDesc" class="modal-desc"></p>
      <div class="modal-actions">
        <button id="modalCancel" class="btn btn-ghost" type="button">取消</button>
        <button id="modalOk" class="btn btn-primary" type="button">确定</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="popup.js"></script>
</body>
</html>
