<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  svg { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F86FF"/>
      <stop offset="52%" stop-color="#5E63F5"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.26" cy="0.12" r="0.85">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="58%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="toplight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="52%" stop-color="#1E1B4B" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0.20"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.2" stdDeviation="2.8" flood-color="#241C63" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- 渐变底板 -->
  <rect x="0" y="0" width="128" height="128" rx="29" fill="url(#bg)"/>
  <rect x="0" y="0" width="128" height="128" rx="29" fill="url(#halo)"/>
  <rect x="0" y="0" width="128" height="128" rx="29" fill="url(#toplight)"/>
  <rect x="0" y="0" width="128" height="128" rx="29" fill="url(#shade)"/>
  <!-- 内描边，让边缘更利落 -->
  <rect x="0.8" y="0.8" width="126.4" height="126.4" rx="28.2" fill="none"
        stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.6"/>

  <!-- 后面的账号（半透明，略小） -->
  <g filter="url(#soft)" fill="#ffffff" opacity="0.66">
    <circle cx="89" cy="56.5" r="12"/>
    <path d="M68 90a21 21 0 0 1 42 0v4.4a4.1 4.1 0 0 1-4.1 4.1H72.1A4.1 4.1 0 0 1 68 94.4z"/>
  </g>

  <!-- 前面的账号（实心，略大） -->
  <g filter="url(#soft)" fill="#ffffff">
    <circle cx="44" cy="47" r="15.2"/>
    <path d="M21 85.6a23 23 0 0 1 46 0v7.6a4.6 4.6 0 0 1-4.6 4.6H25.6A4.6 4.6 0 0 1 21 93.2z"/>
  </g>
</svg>
</body>
</html>
